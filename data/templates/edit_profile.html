{% extends "base.html" %}
{% block title %}编辑资料 - LiteJudge{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 30px auto;">
    <h2>编辑资料</h2>

    <form method="post">
        <div class="form-group">
            <label>昵称</label>
            <input type="text" name="nickname" value="{{ profile_user.nickname or '' }}" placeholder="显示名称">
        </div>
        <div class="form-group">
            <label>邮箱</label>
            <input type="email" name="email" value="{{ profile_user.email or '' }}" placeholder="your@email.com">
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/profile" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
