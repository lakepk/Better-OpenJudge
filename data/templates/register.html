{% extends "base.html" %}
{% block title %}注册 - LiteJudge{% endblock %}
{% block content %}
<div class="card" style="max-width: 450px; margin: 40px auto;">
    <h2>注册</h2>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>用户名 *</label>
            <input type="text" name="username" placeholder="3-20个字符" required minlength="3" maxlength="20">
        </div>
        <div class="form-group">
            <label>昵称</label>
            <input type="text" name="nickname" placeholder="显示名称（可选）">
        </div>
        <div class="form-group">
            <label>邮箱</label>
            <input type="email" name="email" placeholder="your@email.com（可选）">
        </div>
        <div class="form-group">
            <label>密码 *</label>
            <input type="password" name="password" placeholder="至少6位" required minlength="6">
        </div>
        <div class="form-group">
            <label>确认密码 *</label>
            <input type="password" name="confirm" placeholder="再次输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">注册</button>
    </form>

    <p class="text-center mt-20">已有账号？<a href="/login">立即登录</a></p>
</div>
{% endblock %}
