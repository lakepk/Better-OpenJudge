{% extends "base.html" %}
{% block title %}创建题目 - LiteJudge{% endblock %}
{% block content %}
<div class="card">
    <h2>创建题目</h2>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>题目标题 *</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>题目描述 <span class="text-muted">（支持 Markdown）</span></label>
            <textarea name="description" rows="6" placeholder="支持 Markdown 语法"></textarea>
        </div>
        <div class="form-group">
            <label>输入格式 <span class="text-muted">（支持 Markdown）</span></label>
            <textarea name="input_format" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>输出格式 <span class="text-muted">（支持 Markdown）</span></label>
            <textarea name="output_format" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>样例输入</label>
            <textarea name="sample_input" rows="4" style="font-family:monospace;"></textarea>
        </div>
        <div class="form-group">
            <label>样例输出</label>
            <textarea name="sample_output" rows="4" style="font-family:monospace;"></textarea>
        </div>
        <div class="form-group">
            <label>提示 <span class="text-muted">（支持 Markdown）</span></label>
            <textarea name="hint" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>来源</label>
            <input type="text" name="source" placeholder="如: LeetCode 第X题">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <div class="form-group">
                <label>难度</label>
                <select name="difficulty">
                    <option value="1">简单</option>
                    <option value="2" selected>中等</option>
                    <option value="3">困难</option>
                </select>
            </div>
            <div class="form-group">
                <label>时间限制 (ms)</label>
                <input type="number" name="time_limit" value="1000">
            </div>
            <div class="form-group">
                <label>内存限制 (KB)</label>
                <input type="number" name="memory_limit" value="65536">
            </div>
        </div>
        <div class="form-group">
            <label>标签</label>
            <input type="text" name="tags" placeholder="多个标签用逗号分隔，如: 动态规划,贪心,DFS">
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" name="use_spj" value="1">
                启用 Special Judge（SPJ）
            </label>
            <span class="text-muted" style="font-size: 12px;">多解答案、浮点数误差、任意顺序输出等场景</span>
        </div>
        <div class="form-group">
            <label>SPJ 脚本 <span class="text-muted">（Python，启用 SPJ 时必填）</span></label>
            <textarea name="spj_script" rows="10" style="font-family:monospace; background:#1e1e1e; color:#d4d4d4;" placeholder="def check(input_file, output_file, answer_file):
    &#10;    # 返回值: (is_accepted, message)&#10;    # True 表示答案正确，False 表示答案错误&#10;    pass"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">创建题目</button>
        <a href="/admin/problems" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
