{% extends "base.html" %}
{% block title %}创建公告 - LiteJudge{% endblock %}
{% block content %}
<div class="card">
    <h2>创建公告</h2>

    <form method="post">
        <div class="form-group">
            <label>标题 *</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>内容</label>
            <textarea name="content" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label>是否置顶</label>
            <select name="is_pinned">
                <option value="0">否</option>
                <option value="1">是</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">发布公告</button>
        <a href="/admin/announcements" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
