{% extends "base.html" %}
{% block title %}提交代码 - {{ problem.title }} - LiteJudge{% endblock %}
{% block content %}
<div class="card">
    <h2>提交代码: {{ problem.title }}</h2>

    <p class="text-muted mb-20">
        时间限制: {{ problem.time_limit }}ms |
        内存限制: {{ (problem.memory_limit / 1024) | round(1) }}MB
    </p>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form method="post" id="submit-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>编程语言</label>
            <select name="language" id="language-select">
                <option value="cpp">C++</option>
                <option value="python">Python</option>
            </select>
        </div>
        <div class="form-group">
            <label>代码</label>
            <div id="editor-container" style="border: 1px solid #333; border-radius: 6px; overflow: hidden;"></div>
            <!-- CodeMirror 会接管此 textarea，但保留它作为表单提交的载体 -->
            <textarea name="code" id="code-textarea" class="code-editor" placeholder="在此粘贴你的代码..." style="display:none;"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">提交评测</button>
        <a href="/problem/{{ problem.id }}" class="btn btn-secondary">返回题目</a>
    </form>
</div>

<!-- CodeMirror 6 ESM -->
<script type="module">
import {EditorView, basicSetup} from "https://esm.sh/codemirror@6.0.1";
import {cpp} from "https://esm.sh/@codemirror/lang-cpp@6";
import {python} from "https://esm.sh/@codemirror/lang-python@6";
import {oneDark} from "https://esm.sh/@codemirror/theme-one-dark@6";

const languageMap = {
    cpp: cpp(),
    python: python(),
};

// 初始语言
let currentLang = document.getElementById('language-select').value;

const editor = new EditorView({
    doc: '',
    extensions: [
        basicSetup,
        languageMap[currentLang],
        oneDark,
        EditorView.updateListener.of(function(update) {
            if (update.docChanged) {
                document.getElementById('code-textarea').value = update.state.doc.toString();
            }
        }),
        EditorView.theme({
            "&": { height: "400px" },
            ".cm-scroller": { overflow: "auto" },
            ".cm-content": { fontFamily: '"JetBrains Mono", "Fira Code", "Cascadia Code", "Courier New", monospace', fontSize: "14px" },
            ".cm-gutters": { fontFamily: '"JetBrains Mono", "Fira Code", monospace' },
        }),
    ],
    parent: document.getElementById('editor-container'),
});

// 初始同步一次 textarea
document.getElementById('code-textarea').value = '';

// 语言切换
document.getElementById('language-select').addEventListener('change', function() {
    const newLang = this.value;
    if (newLang === currentLang) return;
    currentLang = newLang;
    editor.dispatch({
        effects: EditorView.reconfigure.of([
            basicSetup,
            languageMap[currentLang],
            oneDark,
            EditorView.updateListener.of(function(update) {
                if (update.docChanged) {
                    document.getElementById('code-textarea').value = update.state.doc.toString();
                }
            }),
        ]),
    });
});

// 表单提交前同步
document.getElementById('submit-form').addEventListener('submit', function() {
    document.getElementById('code-textarea').value = editor.state.doc.toString();
});
</script>
{% endblock %}
