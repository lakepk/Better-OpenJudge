{% extends "base.html" %}
{% block title %}提交代码 - {{ problem.title }} - OpenJudge{% endblock %}
{% block content %}
<div class="card">
    <h2>提交代码: {{ problem.title }}</h2>

    <p class="text-muted mb-20">
        时间限制: {{ problem.time_limit }}ms |
        内存限制: {{ (problem.memory_limit / 1024) | round(1) }}MB
    </p>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form method="post" id="submit-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>编程语言</label>
            <select name="language" id="language-select">
                <option value="cpp">C++</option>
                <option value="python">Python</option>
            </select>
        </div>
        <div class="form-group">
            <label>代码</label>
            <!-- Ace Editor 容器，初始隐藏 -->
            <div id="ace-editor" style="height:400px; border:1px solid #333; border-radius:6px; font-size:14px; display:none;"></div>
            <!-- 降级 textarea：Ace 加载失败时可用 -->
            <textarea name="code" id="fallback-textarea" class="code-editor" placeholder="// 在此粘贴或输入你的代码..."
                      style="height:400px; font-size:14px;">{{ code or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">提交评测</button>
        <a href="/problem/{{ problem.id }}" class="btn btn-secondary">返回题目</a>
    </form>
</div>

<script>
(function() {
    var fallback = document.getElementById('fallback-textarea');
    var langSelect = document.getElementById('language-select');
    var aceLoaded = false;

    // If Ace loads before the timeout, upgrade from textarea to Ace
    window.aceUpgrade = function() {
        if (aceLoaded) return;
        aceLoaded = true;

        var aceContainer = document.getElementById('ace-editor');
        aceContainer.style.display = 'block';
        fallback.style.display = 'none';

        var editor = ace.edit('ace-editor', {
            theme: 'ace/theme/monokai',
            mode: 'ace/mode/c_cpp',
            fontSize: '14px',
            showPrintMargin: false,
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            enableSnippets: true,
        });

        // Copy any existing code from textarea into Ace
        if (fallback.value) {
            editor.setValue(fallback.value, -1);
        }

        // Sync Ace → textarea (for form submission)
        editor.session.on('change', function() {
            fallback.value = editor.getValue();
        });

        // Language switch
        var modeMap = { cpp: 'ace/mode/c_cpp', python: 'ace/mode/python' };
        langSelect.addEventListener('change', function() {
            editor.session.setMode(modeMap[this.value] || 'ace/mode/c_cpp');
        });
    };

    // Language change also updates the textarea mode visually
    langSelect.addEventListener('change', function() {
        if (!aceLoaded && this.value === 'python') {
            fallback.placeholder = '# 在此粘贴或输入你的代码...';
        } else if (!aceLoaded) {
            fallback.placeholder = '// 在此粘贴或输入你的代码...';
        }
    });
})();
</script>

<!-- Ace Editor: onload triggers upgrade -->
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.5/src-min-noconflict/ace.js"
        onload="aceUpgrade()"
        onerror="console.info('Ace CDN unreachable, using textarea fallback')">
</script>
{% endblock %}
